name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run verify:metadata

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - run: npm ci
        working-directory: packages/typescript
      - run: npm run verify
        working-directory: packages/typescript
      - run: npm pack --dry-run
        working-directory: packages/typescript

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check build twine
      - run: python -m pip install -e packages/python
      - run: python -m unittest discover -s packages/python/tests -t packages/python
      - run: python -m build packages/python
      - run: python -m twine check packages/python/dist/*
